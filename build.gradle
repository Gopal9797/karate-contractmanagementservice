import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
group 'org.example'
version '1.0-SNAPSHOT'
repositories {
    mavenCentral()
}
dependencies {
    implementation 'org.testng:testng:7.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

//    def karateVersion = "0.9.6"
    def karateVersion = "1.3.1"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation "com.intuit.karate:karate-junit4:$karateVersion"
//    testImplementation "com.intuit.karate:karate-apache:$karateVersion"
    // https://mvnrepository.com/artifact/net.masterthought/cucumber-reporting
    implementation group: 'net.masterthought', name: 'cucumber-reporting', version: '5.7.4'
    // https://mvnrepository.com/artifact/org.springframework/spring-jdbc
    implementation group: 'org.springframework', name: 'spring-jdbc', version: '5.3.10'
    // https://mvnrepository.com/artifact/mysql/mysql-connector-java
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
    // https://mvnrepository.com/artifact/com.oracle.database.jdbc/ojdbc8
    implementation group: 'com.oracle.database.jdbc', name: 'ojdbc8', version: '21.3.0.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.0.0'
    // https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-chrome-driver
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.0.0'
    implementation group: 'org.apache.poi', name: 'poi', version: '5.0.0'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.0.0'
    // https://mvnrepository.com/artifact/org.apache-extras.cassandra-jdbc/cassandra-jdbc
    implementation 'org.apache-extras.cassandra-jdbc:cassandra-jdbc:1.2.5'
//    https://mvnrepository.com/artifact/com.intuit.karate/karate-robot
    implementation 'com.intuit.karate:karate-robot:1.2.0.RC1'
//    https://mvnrepository.com/artifact/com.datastax.oss/java-driver-core
//    implementation 'com.datastax.oss:java-driver-core:4.14.0'
//    https://mvnrepository.com/artifact/com.datastax.cassandra/cassandra-driver-core
    implementation 'com.datastax.cassandra:cassandra-driver-core:3.11.1'
//    https://mvnrepository.com/artifact/com.datastax.cassandra/cassandra-driver-mapping
    implementation 'com.datastax.cassandra:cassandra-driver-mapping:3.11.1'
//    https://mvnrepository.com/artifact/org.postgresql/postgresql
    implementation 'org.postgresql:postgresql:42.3.3'
//    compile group: 'com.datastax.cassandra', name: 'cassandra-driver-core', version: '3.6.0'
//Thanks for using https://jar-download.com


}
sourceSets {
    test {
        resources {
            srcDir file('src/test/java')
            exclude '**/*.java'
        }
    }
}
test {
    useJUnitPlatform()
    testLogging {
        events TestLogEvent.FAILED,
                TestLogEvent.PASSED,
                TestLogEvent.SKIPPED,
                TestLogEvent.STANDARD_ERROR,
                TestLogEvent.STANDARD_OUT
        exceptionFormat TestExceptionFormat.FULL
        showCauses true
        showExceptions true
        showStackTraces true
        outputs.upToDateWhen { false }
        showStandardStreams true
    }


    systemProperty "karate.options", System.properties.getProperty("karate.options")
    systemProperty "karate.env", System.properties.getProperty("karate.env")
    systemProperty "karate.servicename", System.properties.getProperty("karate.servicename")
    systemProperty "karate.configpassword", System.properties.getProperty("karate.configpassword")
    systemProperty "karate.coreTablesLocal", System.properties.getProperty("karate.coreTablesLocal")
    systemProperty "karae.auth", System.properties.getProperty("karate.auth")
    outputs.upToDateWhen { false }
}

task karateExecute(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.intuit.karate.cli.Main"
}
